# Isolated same-host test: no system sites, port 80 or privileged installation.
# Use explicit -p and -c paths from WEB_RUNBOOK.md; upstream is npm start.
worker_processes 1;
pid logs/nginx.pid;
error_log logs/error.log warn;
events {
    worker_connections 128;
}
http {
    access_log off;
    client_body_temp_path temp/client_body;
    proxy_temp_path temp/proxy;
    server {
        listen 127.0.0.1:8080;
        server_name localhost 127.0.0.1;
        allow 127.0.0.1;
        deny all;
        client_max_body_size 1m;
        location / {
            proxy_pass http://127.0.0.1:4173;
            # Retain the browser port and overwrite untrusted forwarded claims.
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_connect_timeout 5s;
            proxy_read_timeout 20s;
        }
    }
}
